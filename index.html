<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Both fonts are visible above the fold: fetch them before the CSS asks for them -->
    <link rel="preload" href="/src/assets/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/newsreader-italic-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>Kike Beses · Desarrollador full-stack</title>
    <meta
      name="description"
      content="Portfolio de Kike (Enrique Beses), desarrollador full-stack: interfaces con React y servidores con Node.js, Java o PHP."
    />
    <meta name="theme-color" content="#ff8a3d" />
    <!--
      Site URL: https://kikebeses.vercel.app/. If the domain changes, update it here
      (canonical, og:url, og:image) and in public/robots.txt and public/sitemap.xml.
    -->
    <link rel="canonical" href="https://kikebeses.vercel.app/" />
    <!-- Link previews on social networks -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kikebeses.vercel.app/" />
    <meta property="og:site_name" content="Kike Beses" />
    <meta property="og:title" content="Kike Beses · Desarrollador full-stack" />
    <meta
      property="og:description"
      content="Portfolio de Kike (Enrique Beses), desarrollador full-stack: interfaces con React y servidores con Node.js, Java o PHP."
    />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:image" content="https://kikebeses.vercel.app/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hola, soy Kike. Desarrollador Full-Stack." />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved theme, or the system one on a first visit, before the
      // first paint so there is no flash. Keep the key and the bar colours in
      // sync with src/theme.ts.
      ;(function () {
        var stored = null
        try {
          stored = localStorage.getItem('theme')
        } catch (e) {}
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#4a1c07' : '#ff8a3d')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
